# =============================================================================
# Stage 1 — garment warping
#
# Tuning order when things look wrong:
#   garment lands in the wrong place  -> raise loss.shape, train longer
#   garment is torn / folded          -> raise loss.tv, loss.smooth, loss.grid
#   garment is rigid, ignores the body-> raise model.max_displacement, lower tv
#   overfits (train good, val bad)    -> raise augment.garment_* , lower model.base
# =============================================================================

seed: 42
device: auto                     # auto | cpu | cuda | mps
output_dir: outputs/warp

data:
  root: /path/to/your/dataset    # <-- the folder containing person/ garments/ cihp/ segmentation/
  manifest: null                 # defaults to <root>/manifest.json
  rebuild_manifest: false
  # null = auto-detect. `cond/`, `seg/`, `parse/`, `cihp_maps/` and
  # similar are all resolved automatically; name one here to force it.
  person_dir: null
  garment_dir: null
  cihp_dir: null
  segmentation_dir: null
  # auto | garment_mask | person_mask | parse | ignore
  segmentation_role: auto
  # Which folder holds the label maps: cihp | segmentation | auto.
  # A dataset can carry two conditional folders where only one is a
  # label map. Identify it with: check_dataset.py --diagnose-labels
  parse_source: auto

  height: 256
  width: 192
  # Which parsing convention your maps follow: cihp (= LIP, 20 classes) or
  # atr (18 classes). WRONG VALUE = silently erasing the wrong body parts.
  # Identify yours with: scripts/check_dataset.py --diagnose-labels
  label_scheme: cihp

  # auto = pick the garment region per sample from the filename and colour.
  # Required for a dataset mixing dresses, tops and trousers. Force one region
  # for every sample with upper | lower | full.
  garment_type: auto

  # Crop each photo to the person's bounding box, at native resolution.
  # Source images that are scenes rather than studio shots leave the
  # garment covering ~3% of the frame; cropping is the largest quality
  # lever available on such data. check_dataset.py --audit reports the
  # resulting garment coverage.
  crop_to_person: true
  # garment = frame the garment plus context, extended to keep the head.
  # person  = frame the whole body. On full-body photos that leaves an
  #           upper garment covering ~6% of the frame, because growing a
  #           narrow standing figure to the frame's aspect adds mostly
  #           background. check_dataset.py --audit reports the coverage.
  crop_mode: garment
  crop_context: 0.6
  crop_margin: 0.05

  # Crop each garment to its mask and rescale, so framing is consistent.
  canonicalise_garment: true
  garment_fill: 0.8

  # Drop samples that fail the per-sample quality audit (noisy parse
  # maps, no garment region, degenerate garment masks). See
  # check_dataset.py --audit for the list and the reasons.
  audit_filter: true

  erase_dilate: 5                # px of slack around the erased garment region
  val_fraction: 0.15

augment:
  enabled: true
  hflip: 0.5
  # Person jitter stays small: the parse map must keep describing the image.
  person_shift: 0.04
  person_scale: 0.06
  person_rotate: 4.0
  # Garment jitter is aggressive on purpose — it is what stops the warper
  # collapsing to a near-identity transform. See data/augment.py.
  garment_shift: 0.12
  garment_scale: 0.18
  garment_rotate: 12.0
  brightness: 0.15
  contrast: 0.15
  saturation: 0.12

model:
  base: 32
  feature_channels: 128
  grid_size: 5                   # 5x5 = 25 TPS control points = 50 DOF
  max_displacement: 0.12         # bound on the dense residual flow
  use_residual_flow: true

loss:
  shape: 10.0                    # silhouette agreement — the main signal
  coarse_shape: 2.0              # same, applied to the TPS-only result
  pixel: 5.0                     # masked L1 on warped garment RGB
  perceptual: 1.0                # set 0.0 to train without downloading VGG19
  style: 0.0
  # Path to a locally downloaded vgg19 state_dict, if torchvision cannot
  # fetch it (548MB). See README section 5.
  vgg_weights: null
  grid: 2.0                      # TPS lattice regularity
  tv: 4.0                        # first-order flow smoothness
  smooth: 2.0                    # second-order flow smoothness

train:
  steps: 12000
  batch_size: 4
  accumulate: 1                  # raise instead of batch_size if RAM-bound
  lr: 0.0002
  weight_decay: 0.0001
  grad_clip: 1.0
  ema_decay: 0.999
  num_workers: 0                 # 0 is faster than >0 for tiny datasets on CPU
  # Pick up automatically from <output_dir>/*.pt if it exists. Set false
  # to start clean. Essential on Colab, where sessions get cut off.
  resume: true
  log_every: 50
  sample_every: 500
  save_every: 1000
