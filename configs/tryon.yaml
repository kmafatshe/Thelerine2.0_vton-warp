# =============================================================================
# Stage 2 — composition
#
# Requires a trained stage-1 checkpoint (train.warp_checkpoint).
#
# Tuning order when things look wrong:
#   output blurry / washed out      -> raise loss.alpha and loss.perceptual
#   garment texture visibly copied
#     but edges harsh               -> lower loss.alpha_sparse
#   skin/garment boundary wrong     -> raise loss.l1_garment
#   still soft after everything     -> enable GAN (loss.gan: 0.5)
#   GAN turned on and quality fell
#     off a cliff                   -> raise gan_start_step, lower lr_d
# =============================================================================

seed: 42
device: auto
output_dir: outputs/tryon

data:
  root: /path/to/your/dataset
  manifest: null
  rebuild_manifest: false
  # null = auto-detect. `cond/`, `seg/`, `parse/`, `cihp_maps/` and
  # similar are all resolved automatically; name one here to force it.
  person_dir: null
  garment_dir: null
  cihp_dir: null
  segmentation_dir: null
  segmentation_role: auto

  height: 256
  width: 192
  garment_type: upper
  erase_dilate: 5
  val_fraction: 0.15

augment:
  enabled: true
  hflip: 0.5
  person_shift: 0.04
  person_scale: 0.06
  person_rotate: 4.0
  # Milder than stage 1: the composer is being judged against the real person,
  # so we do not want the garment arriving from an implausible starting pose.
  garment_shift: 0.06
  garment_scale: 0.10
  garment_rotate: 6.0
  brightness: 0.12
  contrast: 0.12
  saturation: 0.10

model:
  base: 32
  depth: 4                       # 4 downsamples -> 16x12 bottleneck at 256x192
  max_channels: 256
  d_base: 32

loss:
  l1: 1.0
  l1_garment: 5.0                # weight the region that actually changes
  perceptual: 1.0
  style: 0.0
  # Path to a locally downloaded vgg19 state_dict, if torchvision cannot
  # fetch it (548MB). See README section 5.
  vgg_weights: null
  alpha: 2.0                     # "copy, do not hallucinate" — do not set to 0
  alpha_sparse: 0.5
  gan: 0.0                       # start at 0.0; set 0.5 once stage 2 converges

train:
  warp_checkpoint: outputs/warp/warp.pt
  steps: 15000
  batch_size: 4
  accumulate: 1
  lr: 0.0002
  lr_d: 0.0001
  weight_decay: 0.0001
  grad_clip: 1.0
  ema_decay: 0.999
  num_workers: 0
  gan_start_step: 6000
  diffaug: color,translation,cutout
  finetune_warper_after: 0       # e.g. 10000 to jointly finetune near the end
  # Pick up automatically from <output_dir>/*.pt if it exists. Set false
  # to start clean. Essential on Colab, where sessions get cut off.
  resume: true
  log_every: 50
  sample_every: 500
  save_every: 1000
